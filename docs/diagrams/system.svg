<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c05621"/></marker>
  </defs>
  <rect width="960" height="490" rx="14" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#1a202c">How the boards fit together (2 MB)</text>
  <text x="30" y="60" fill="#4a5568">The 512K setup is the same without the DAT board and the bank cable.</text>

  <!-- motherboard area -->
  <rect x="20" y="80" width="920" height="390" rx="12" fill="#f7fafc" stroke="#cbd5e0" stroke-dasharray="6 5"/>
  <text x="36" y="102" fill="#718096" font-size="13">CoCo 3 motherboard</text>

  <!-- CPU on DAT -->
  <rect x="50" y="125" width="220" height="56" rx="8" fill="#2d3748"/>
  <text x="160" y="150" text-anchor="middle" fill="#fff" font-weight="bold">6809 / 6309 CPU</text>
  <text x="160" y="169" text-anchor="middle" fill="#e2e8f0" font-size="12">plugs into the DAT board</text>
  <rect x="50" y="185" width="220" height="118" rx="8" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="160" y="209" text-anchor="middle" fill="#2b6cb0" font-weight="bold">DAT board</text>
  <text x="160" y="228" text-anchor="middle" fill="#2a4365" font-size="12">in the CPU socket; all 40 pins</text>
  <text x="160" y="244" text-anchor="middle" fill="#2a4365" font-size="12">pass straight through</text>
  <rect x="85" y="255" width="150" height="36" rx="5" fill="#fff" stroke="#2b6cb0"/>
  <text x="160" y="270" text-anchor="middle" fill="#2a4365" font-size="12">ATF1504AS CPLD</text>
  <text x="160" y="285" text-anchor="middle" fill="#2a4365" font-size="11">watches CPU writes</text>
  <rect x="50" y="306" width="220" height="20" rx="4" fill="#e2e8f0"/>
  <text x="160" y="320" text-anchor="middle" fill="#4a5568" font-size="12">CPU socket</text>

  <!-- GIME -->
  <rect x="400" y="140" width="150" height="150" rx="10" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="475" y="200" text-anchor="middle" font-weight="bold" font-size="17" fill="#1a202c">GIME</text>
  <text x="475" y="222" text-anchor="middle" fill="#4a5568" font-size="12">MMU (6 bits per</text>
  <text x="475" y="238" text-anchor="middle" fill="#4a5568" font-size="12">register), video,</text>
  <text x="475" y="254" text-anchor="middle" fill="#4a5568" font-size="12">memory timing</text>

  <!-- CPU bus -->
  <line x1="272" y1="160" x2="398" y2="180" stroke="#4a5568" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="335" y="150" text-anchor="middle" fill="#2d3748" font-size="12">CPU bus</text>
  <text x="335" y="200" text-anchor="middle" fill="#718096" font-size="11">A0–A15, D0–D7,</text>
  <text x="335" y="214" text-anchor="middle" fill="#718096" font-size="11">R/W, E, Q, /RESET</text>

  <!-- memory board -->
  <rect x="690" y="125" width="225" height="200" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="802" y="150" text-anchor="middle" fill="#2f855a" font-weight="bold">2048K memory board</text>
  <text x="802" y="170" text-anchor="middle" fill="#22543d" font-size="12">replaces the four DRAMs</text>
  <rect x="715" y="185" width="175" height="40" rx="5" fill="#fff" stroke="#2f855a"/>
  <text x="802" y="210" text-anchor="middle" fill="#22543d" font-size="12">'574 row + bank latch</text>
  <rect x="715" y="235" width="175" height="40" rx="5" fill="#fff" stroke="#2f855a"/>
  <text x="802" y="260" text-anchor="middle" fill="#22543d" font-size="12">1M × 16 SRAM</text>
  <rect x="690" y="330" width="225" height="20" rx="4" fill="#e2e8f0"/>
  <text x="802" y="344" text-anchor="middle" fill="#4a5568" font-size="12">CN4 / CN5 / CN6</text>

  <!-- GIME to memory -->
  <line x1="552" y1="195" x2="688" y2="195" stroke="#4a5568" stroke-width="3" marker-end="url(#a)"/>
  <text x="620" y="158" text-anchor="middle" fill="#2d3748" font-size="12">MA0–MA8</text>
  <text x="620" y="172" text-anchor="middle" fill="#718096" font-size="11">/RAS, /CAS</text>
  <text x="620" y="186" text-anchor="middle" fill="#718096" font-size="11">/WE0, /WE1</text>
  <line x1="552" y1="255" x2="688" y2="255" stroke="#4a5568" stroke-width="3" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="620" y="246" text-anchor="middle" fill="#2d3748" font-size="12">D0–D15</text>

  <!-- bank cable -->
  <path d="M272,245 C420,440 600,440 690,305" fill="none" stroke="#c05621" stroke-width="3" marker-end="url(#o)"/>
  <text x="480" y="430" text-anchor="middle" fill="#c05621" font-weight="bold">BANK0, BANK1  (physical A19, A20)</text>
  <text x="480" y="448" text-anchor="middle" fill="#9c4221" font-size="12">bank cable, DAT J2 → memory J3, both 2×2 (B pair + G pair)</text>

  <!-- LED -->
  <circle cx="62" cy="352" r="7" fill="#f6e05e" stroke="#975a16"/>
  <text x="76" y="357" fill="#975a16" font-size="12">J4: turbo LED (optional)</text>
</svg>
