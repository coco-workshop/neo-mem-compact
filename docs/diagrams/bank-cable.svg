<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <rect width="900" height="440" rx="14" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="bold" fill="#1a202c">Bank cable: DAT J2 to memory J3</text>
  <text x="30" y="60" fill="#4a5568">Both headers are 2×2 (like the GIME-Z): two B pins side by side and two G pins beside them. Pin 1 (square pad) is a B.</text>

  <!-- DAT board -->
  <rect x="30" y="85" width="300" height="290" rx="12" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="180" y="110" text-anchor="middle" font-weight="bold" fill="#2b6cb0">DAT board</text>
  <rect x="45" y="190" width="80" height="80" rx="6" fill="#fff" stroke="#2b6cb0"/>
  <text x="85" y="226" text-anchor="middle" font-size="12" fill="#2a4365">CPLD</text>
  <text x="85" y="242" text-anchor="middle" font-size="11" fill="#2a4365">BANK0/1</text>
  <g stroke="#2a4365" stroke-width="2" fill="#fff">
    <line x1="125" y1="210" x2="140" y2="210"/><rect x="140" y="202" width="40" height="16" rx="2"/><path d="M180,210 H200 V170 H232" fill="none"/>
    <line x1="125" y1="250" x2="140" y2="250"/><rect x="140" y="242" width="40" height="16" rx="2"/><path d="M180,250 H210 V230 H232" fill="none"/>
  </g>
  <text x="160" y="197" text-anchor="middle" font-size="11" fill="#2a4365">R1 100 Ω</text>
  <text x="160" y="275" text-anchor="middle" font-size="11" fill="#2a4365">R2 100 Ω</text>
  <!-- J2 2x2: B column (outer) pins 1,3; G column (inner) pins 2,4 -->
  <rect x="232" y="140" width="86" height="120" rx="4" fill="#2d3748"/>
  <text x="275" y="133" text-anchor="middle" font-weight="bold" font-size="13" fill="#2b6cb0">J2</text>
  <rect x="245" y="160" width="20" height="20" fill="#d69e2e"/>
  <circle cx="255" cy="230" r="10" fill="#d69e2e"/>
  <circle cx="295" cy="170" r="10" fill="#9fb3c8"/>
  <circle cx="295" cy="230" r="10" fill="#9fb3c8"/>
  <g font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">
    <text x="255" y="204">B</text><text x="295" y="204">G</text>
  </g>
  <text x="275" y="352" text-anchor="middle" font-size="11" fill="#2a4365">B column on the board edge, G column</text>
  <text x="275" y="366" text-anchor="middle" font-size="11" fill="#2a4365">toward the CPU; marked B and G</text>

  <!-- memory board -->
  <rect x="570" y="85" width="300" height="290" rx="12" fill="#f0fff4" stroke="#2f855a" stroke-width="2"/>
  <text x="720" y="110" text-anchor="middle" font-weight="bold" fill="#2f855a">2048K memory board</text>
  <rect x="582" y="140" width="86" height="120" rx="4" fill="#2d3748"/>
  <text x="625" y="133" text-anchor="middle" font-weight="bold" font-size="13" fill="#2f855a">J3</text>
  <circle cx="605" cy="170" r="10" fill="#9fb3c8"/>
  <circle cx="605" cy="230" r="10" fill="#9fb3c8"/>
  <circle cx="645" cy="170" r="10" fill="#d69e2e"/>
  <rect x="635" y="220" width="20" height="20" fill="#d69e2e"/>
  <g font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle">
    <text x="605" y="204">G</text><text x="645" y="204">B</text>
  </g>
  <g stroke="#22543d" stroke-width="2" fill="none">
    <path d="M655,170 H700 V190 H755"/>
    <path d="M655,230 H755"/>
  </g>
  <rect x="755" y="170" width="105" height="80" rx="6" fill="#fff" stroke="#2f855a"/>
  <text x="807" y="200" text-anchor="middle" font-size="12" fill="#22543d">'574 latch</text>
  <text x="807" y="216" text-anchor="middle" font-size="11" fill="#22543d">bank bits</text>
  <text x="807" y="234" text-anchor="middle" font-size="10" fill="#22543d">R1/R2: 10k to GND</text>
  <text x="720" y="352" text-anchor="middle" font-size="11" fill="#22543d">B row and G row, marked on</text>
  <text x="720" y="366" text-anchor="middle" font-size="11" fill="#22543d">the silkscreen (drawn turned to match J2)</text>

  <g stroke="#4a5568" stroke-width="1.5" fill="none">
    <path d="M295,260 V272 M285,272 H305 M289,276 H301 M293,280 H297"/>
    <path d="M605,260 V272 M595,272 H615 M599,276 H611 M603,280 H607"/>
  </g>
  <!-- wires -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M255,170 C320,105 600,105 645,170" stroke="#c05621"/>
    <path d="M255,230 C320,320 600,320 645,230" stroke="#c05621"/>
    <path d="M295,170 C380,158 520,158 605,170" stroke="#1a202c" stroke-dasharray="8 6"/>
    <path d="M295,230 C380,242 520,242 605,230" stroke="#1a202c" stroke-dasharray="8 6"/>
  </g>
  <text x="450" y="112" text-anchor="middle" font-size="12" fill="#c05621">B to B (required; either way round)</text>
  <text x="450" y="200" text-anchor="middle" font-size="12" fill="#1a202c">G to G (optional)</text>

  <g font-size="12" fill="#4a5568">
    <text x="30" y="400">A 2×2 female-to-female cable wired pin 1 to pin 1 works as is; keep each square pad on the square pad so the B pins</text>
    <text x="30" y="416">stay on B. Two single leads on the B pins alone also work. Swapping the two B wires only reorders the 2 MB, and the</text>
    <text x="30" y="432">100 Ω resistors protect the outputs if a plug goes on turned round.</text>
  </g>
</svg>
