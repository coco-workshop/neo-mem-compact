<svg xmlns="http://www.w3.org/2000/svg" width="900" height="630" viewBox="0 0 900 630" font-family="Helvetica, Arial, sans-serif" font-size="14">
<rect width="900" height="630" rx="14" fill="#ffffff"/>
<text x="30" y="38" font-size="20" font-weight="bold" fill="#1a202c">How the DAT board picks the bank for each memory slot</text>
<text x="30" y="60" fill="#4a5568">The CPU slot is always the one that ends when E falls.</text>
<text x="30" y="110" font-size="17" font-weight="bold" fill="#1a202c">Fast mode (1.79 MHz):  video, CPU</text>
<text x="30" y="130" fill="#4a5568" font-size="13">CPU slot = E high</text>
<text x="176" y="168" text-anchor="end" font-weight="bold" fill="#2d3748">GIME slot</text>
<rect x="192" y="148" width="74" height="28" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/>
<text x="229" y="167" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">video</text>
<rect x="270" y="148" width="74" height="28" rx="5" fill="#fffaf0" stroke="#c05621"/>
<text x="307" y="167" text-anchor="middle" fill="#c05621" font-size="13" font-weight="bold">CPU</text>
<rect x="348" y="148" width="74" height="28" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/>
<text x="385" y="167" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">video</text>
<rect x="426" y="148" width="74" height="28" rx="5" fill="#fffaf0" stroke="#c05621"/>
<text x="463" y="167" text-anchor="middle" fill="#c05621" font-size="13" font-weight="bold">CPU</text>
<polyline points="190,226 268,226 268,198 346,198 346,226 424,226 424,198 502,198 502,226 502,226" fill="none" stroke="#1a202c" stroke-width="2.5"/>
<text x="176" y="217" text-anchor="end" font-weight="bold" fill="#2d3748">E</text>
<polyline points="190,271 229,271 229,243 307,243 307,271 385,271 385,243 463,243 463,271 502,271" fill="none" stroke="#1a202c" stroke-width="2.5"/>
<text x="176" y="262" text-anchor="end" font-weight="bold" fill="#2d3748">Q</text>
<text x="176" y="307" text-anchor="end" font-weight="bold" fill="#2d3748">BANK lines</text>
<polygon points="194,302 200,290 262,290 268,302 262,314 200,314" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="231" y="306" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="272,302 278,290 340,290 346,302 340,314 278,314" fill="#fbd38d" stroke="#c05621"/>
<text x="309" y="306" text-anchor="middle" font-size="11" fill="#1a202c">CPU bank</text>
<polygon points="350,302 356,290 418,290 424,302 418,314 356,314" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="387" y="306" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="428,302 434,290 496,290 502,302 496,314 434,314" fill="#fbd38d" stroke="#c05621"/>
<text x="465" y="306" text-anchor="middle" font-size="11" fill="#1a202c">CPU bank</text>
<line x1="190" y1="142" x2="190" y2="320" stroke="#a0aec0" stroke-dasharray="3 4"/>
<line x1="346" y1="142" x2="346" y2="320" stroke="#a0aec0" stroke-dasharray="3 4"/>
<line x1="502" y1="142" x2="502" y2="320" stroke="#a0aec0" stroke-dasharray="3 4"/>
<text x="532" y="180" font-size="13" fill="#4a5568">Each GIME memory slot is</text>
<text x="532" y="198" font-size="13" fill="#4a5568">~280 ns (3.58 MHz) in both modes.</text>
<text x="532" y="228" font-size="13" fill="#4a5568">Dashed lines: E falling edges.</text>
<text x="532" y="258" font-size="13" fill="#4a5568">The memory board latches the</text>
<text x="532" y="276" font-size="13" fill="#4a5568">BANK lines when /RAS falls</text>
<text x="532" y="294" font-size="13" fill="#4a5568">in each slot.</text>
<text x="30" y="370" font-size="17" font-weight="bold" fill="#1a202c">Slow mode (0.89 MHz):  video, idle, video, CPU</text>
<text x="30" y="390" fill="#4a5568" font-size="13">CPU slot = E high and Q low</text>
<text x="176" y="428" text-anchor="end" font-weight="bold" fill="#2d3748">GIME slot</text>
<rect x="192" y="408" width="74" height="28" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/>
<text x="229" y="427" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">video</text>
<rect x="270" y="408" width="74" height="28" rx="5" fill="#f7fafc" stroke="#a0aec0"/>
<text x="307" y="427" text-anchor="middle" fill="#a0aec0" font-size="13" font-weight="bold">idle</text>
<rect x="348" y="408" width="74" height="28" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/>
<text x="385" y="427" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">video</text>
<rect x="426" y="408" width="74" height="28" rx="5" fill="#fffaf0" stroke="#c05621"/>
<text x="463" y="427" text-anchor="middle" fill="#c05621" font-size="13" font-weight="bold">CPU</text>
<rect x="504" y="408" width="74" height="28" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/>
<text x="541" y="427" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">video</text>
<rect x="582" y="408" width="74" height="28" rx="5" fill="#f7fafc" stroke="#a0aec0"/>
<text x="619" y="427" text-anchor="middle" fill="#a0aec0" font-size="13" font-weight="bold">idle</text>
<rect x="660" y="408" width="74" height="28" rx="5" fill="#ebf8ff" stroke="#2b6cb0"/>
<text x="697" y="427" text-anchor="middle" fill="#2b6cb0" font-size="13" font-weight="bold">video</text>
<rect x="738" y="408" width="74" height="28" rx="5" fill="#fffaf0" stroke="#c05621"/>
<text x="775" y="427" text-anchor="middle" fill="#c05621" font-size="13" font-weight="bold">CPU</text>
<polyline points="190,486 346,486 346,458 502,458 502,486 658,486 658,458 814,458 814,486 814,486" fill="none" stroke="#1a202c" stroke-width="2.5"/>
<text x="176" y="477" text-anchor="end" font-weight="bold" fill="#2d3748">E</text>
<polyline points="190,531 268,531 268,503 424,503 424,531 580,531 580,503 736,503 736,531 814,531" fill="none" stroke="#1a202c" stroke-width="2.5"/>
<text x="176" y="522" text-anchor="end" font-weight="bold" fill="#2d3748">Q</text>
<text x="176" y="567" text-anchor="end" font-weight="bold" fill="#2d3748">BANK lines</text>
<polygon points="194,562 200,550 262,550 268,562 262,574 200,574" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="231" y="566" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="272,562 278,550 340,550 346,562 340,574 278,574" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="309" y="566" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="350,562 356,550 418,550 424,562 418,574 356,574" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="387" y="566" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="428,562 434,550 496,550 502,562 496,574 434,574" fill="#fbd38d" stroke="#c05621"/>
<text x="465" y="566" text-anchor="middle" font-size="11" fill="#1a202c">CPU bank</text>
<polygon points="506,562 512,550 574,550 580,562 574,574 512,574" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="543" y="566" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="584,562 590,550 652,550 658,562 652,574 590,574" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="621" y="566" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="662,562 668,550 730,550 736,562 730,574 668,574" fill="#bee3f8" stroke="#2b6cb0"/>
<text x="699" y="566" text-anchor="middle" font-size="11" fill="#1a202c">video bank</text>
<polygon points="740,562 746,550 808,550 814,562 808,574 746,574" fill="#fbd38d" stroke="#c05621"/>
<text x="777" y="566" text-anchor="middle" font-size="11" fill="#1a202c">CPU bank</text>
<line x1="190" y1="402" x2="190" y2="580" stroke="#a0aec0" stroke-dasharray="3 4"/>
<line x1="502" y1="402" x2="502" y2="580" stroke="#a0aec0" stroke-dasharray="3 4"/>
<line x1="814" y1="402" x2="814" y2="580" stroke="#a0aec0" stroke-dasharray="3 4"/>
<text x="30" y="608" font-size="12" fill="#4a5568">CPU bank = bits 7:6 of the active MMU register (bank 0 if the MMU is off, or for $FExx with MC3 set).   Video bank = $FF9B bits 1:0.</text>
</svg>
